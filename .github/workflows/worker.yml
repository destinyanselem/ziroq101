name: ZIROQ worker

# Runs when you tap "Start worker now" on the website, and also every 15 minutes to pick up queued jobs.
# Scheduled runs use a lightweight queue check. Manual starts skip that extra runner so the processing job can be allocated immediately.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: ziroq-worker
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_job: ${{ steps.poll.outputs.has_job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements-check.txt
      - run: pip install -r worker/requirements-check.txt
      - id: poll
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set +e
          python worker/main.py check
          code=$?
          if [ "$code" -eq 0 ]; then echo "has_job=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 10 ]; then echo "has_job=false" >> "$GITHUB_OUTPUT"
          else echo "check failed with exit code $code"; exit "$code"; fi

  process:
    needs: check
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.has_job == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -r worker/requirements.txt
      - name: Start local YouTube PO-token provider
        run: |
          docker run --name ziroq-pot-provider -d --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:4416/ping", timeout=2) as response:
                      if response.status != 200:
                          raise RuntimeError(f"unexpected provider HTTP status: {response.status}")
                      health = json.loads(response.read().decode("utf-8"))
                      print(f"YouTube PO-token provider is healthy (version: {health.get('version', 'unknown')}).")
                      break
              except Exception as exc:
                  if attempt == 29:
                      raise SystemExit(f"YouTube PO-token provider health check failed: {exc}") from exc
                  time.sleep(1)
          PY
      - name: Run one job
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: python worker/main.py run
